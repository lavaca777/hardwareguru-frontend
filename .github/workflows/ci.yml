name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, tests and build
    runs-on: ubuntu-latest
    env:
      VITE_USE_MOCKS: 'true'
      VITE_API_URL: 'http://localhost:3000/api'
      VITE_MOCK_DELAY_MS: '0'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests and coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage
          if-no-files-found: ignore

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: |
          docker build \
            --build-arg VITE_USE_MOCKS=true \
            --build-arg VITE_API_URL=http://localhost:3000/api \
            -t hardwareguru-frontend:ci .

      - name: Start container
        run: docker run -d --name hardwareguru-frontend-ci -p 8080:80 hardwareguru-frontend:ci

      - name: Smoke test
        run: |
          for attempt in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:8080/healthz >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/healthz
          curl -fsS http://127.0.0.1:8080/ | grep -q 'id="root"'

      - name: Stop container
        if: always()
        run: docker rm -f hardwareguru-frontend-ci || true
